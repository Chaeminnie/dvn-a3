schema_version: 2
dashboard:
  title: Do some languages cost more tokens than others in AI language models?
  subject: ai_language_inequality
  question: Is the extra token cost of non-English languages a fixed property of their scripts, or a result
    of tokeniser design choices that is shrinking?
  audience: Pricing and monetisation lead at a global AI service, deciding whether to absorb the extra
    token cost, price it into plans and quotas, or invest in a better tokeniser.
  entrypoint: app.py
  pages: []
  sample_environment_variable: DASHBOARD_SAMPLE_MODE
sources:
- id: flores_plus
  publisher: Open Language Data Initiative (OLDI)
  title: FLORES+ devtest (200 sentences x 15 languages)
  url: https://huggingface.co/datasets/openlanguagedata/flores_plus
  licence: CC BY-SA 4.0
  retrieved: '2026-10-07'
  cadence: Static benchmark
  status: snapshot
  notes: Hugging Face dataset revision hash not recorded (TODO in data_dictionary.md).
- id: tokenizers_src
  publisher: OpenAI, Alibaba, Google, Meta, Mistral AI
  title: 'Tokeniser files: tiktoken encodings and Hugging Face tokenisers'
  url: https://github.com/openai/tiktoken
  licence: Mixed; see data_dictionary.md (several licences still marked TODO)
  retrieved: '2026-10-11'
  cadence: Per model release
  status: snapshot
- id: anthropic_google_counts
  publisher: Anthropic, Google
  title: Token-counting API for Claude and Gemini models
  url: https://platform.claude.com/docs/en/build-with-claude/token-counting
  licence: Provider terms of service
  retrieved: '2026-10-11'
  cadence: Per API call
  status: snapshot
  notes: Raw counts in data/source/api_token_counts_raw.csv, run 2026-10-11.
- id: team_assumption
  publisher: Project team
  title: Placeholder equal language weights
  url: https://github.com/
  licence: Project-authored
  retrieved: '2026-10-11'
  cadence: Not applicable
  status: snapshot
  notes: Not real usage data. Replace with a sourced language mix.
- id: petrov_2023
  publisher: Petrov, La Malfa, Torr and Bibi (University of Oxford); NeurIPS 2023
  title: Language Model Tokenizers Introduce Unfairness Between Languages (Tables 1 and 5)
  url: https://proceedings.neurips.cc/paper_files/paper/2023/hash/74bb24dca8334adce292883b4b651eda-Abstract.html
  licence: Paper values transcribed for comparison; see the paper for terms
  retrieved: '2026-10-19'
  cadence: Static publication
  status: snapshot
  notes: 11 published premiums used only to check our computed values.
datasets:
- id: token_premium
  source_ids:
  - flores_plus
  - tokenizers_src
  sample: data/processed/token_premium.csv
  processed_output: data/processed/token_premium.csv
  format: csv
  date_column: null
  primary_key:
  - lang_code
  - tokenizer_id
  minimum_rows: 180
  latest_observation: '2026-10-11'
  columns:
    lang_code:
      type: string
      role: geography
      nullable: false
      allowed_values:
      - amh_Ethi
      - arb_Arab
      - cmn_Hans
      - deu_Latn
      - eng_Latn
      - fra_Latn
      - hin_Deva
      - jpn_Jpan
      - kor_Hang
      - mya_Mymr
      - rus_Cyrl
      - spa_Latn
      - swh_Latn
      - tam_Taml
      - tha_Thai
    tokenizer_id:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - cl100k_base
      - claude_haiku_4_5
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - gemma2
      - gemma3
      - gpt2
      - llama3
      - mistral_nemo
      - o200k_base
      - qwen2.5
      - qwen3
    n_sentences:
      type: integer
      role: measure
      nullable: false
      unit: sentences
      minimum: 200
      maximum: 200
    total_tokens:
      type: integer
      role: measure
      nullable: false
      unit: tokens
      minimum: 0
      maximum: 1000000
    total_chars:
      type: integer
      role: measure
      nullable: false
      unit: characters
      minimum: 0
      maximum: 1000000
    total_bytes:
      type: integer
      role: measure
      nullable: false
      unit: bytes
      minimum: 0
      maximum: 1000000
    mean_tokens_per_sentence:
      type: number
      role: measure
      nullable: false
      unit: tokens
      minimum: 0
      maximum: 1000
    premium_vs_en:
      type: number
      role: measure
      nullable: false
      unit: ratio to English
      minimum: 0.5
      maximum: 30
    byte_premium_vs_en:
      type: number
      role: measure
      nullable: false
      unit: ratio to English
      minimum: 0.5
      maximum: 10
    premium_over_byte:
      type: number
      role: measure
      nullable: false
      unit: ratio
      minimum: 0.2
      maximum: 10
  notes: Tokens for a language divided by tokens for English on the same tokeniser and the same 200 sentences.
    Produced by run_all.sh.

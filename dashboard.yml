- id: tokenizer_gini
  source_ids:
  - flores_plus
  - tokenizers_src
  sample: data/processed/tokenizer_gini.csv
  processed_output: data/processed/tokenizer_gini.csv
  format: csv
  date_column: null
  primary_key:
  - tokenizer_id
  minimum_rows: 12
  latest_observation: '2026-10-11'
  columns:
    tokenizer_id:
      type: string
      role: dimension
      nullable: false
    n_languages:
      type: integer
      role: dimension
      nullable: false
    gini:
      type: number
      role: measure
      nullable: false
      unit: Gini coefficient of the language premiums (0 = equal, 1 = most unequal)
      minimum: 0
      maximum: 1
    gini_byte_baseline:
      type: number
      role: measure
      nullable: false
      unit: Gini coefficient of the byte premiums (the same for every tokeniser)
      minimum: 0
      maximum: 1
    max_premium:
      type: number
      role: measure
      nullable: false
      unit: ratio to English
      minimum: 1
      maximum: 30
    max_premium_lang:
      type: string
      role: geography
      nullable: false
      allowed_values:
      - amh_Ethi
      - mya_Mymr
    median_premium:
      type: number
      role: measure
      nullable: false
      unit: ratio to English
      minimum: 1
      maximum: 30
  notes: One row per tokeniser. Gini, maximum and median are taken across the 15 languages (English included at 1.0x).

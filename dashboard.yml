views:
- id: tokeniser_trend
  dataset_id: tokenizer_gini
  page: app.py
  title: 'Newer tokenisers are usually fairer than older ones: 3 of 4 families improved across 12 tokenisers'
  unit: Gini (0 to 1) and premium (tokens vs English)
  source_ids:
  - flores_plus
  - tokenizers_src
  controls:
  - key: trend_measure
    type: radio
    label: Measure
    default_value: gini
    test_value: max_premium
    filter:
      column: measure
      operator: eq
  - key: trend_scope
    type: radio
    label: Families
    default_value: versions
    test_value: all
    filter:
      column: n_versions
      operator: gt
  outputs:
  - chart
  - metric
  - download
- id: premium_by_language
  dataset_id: token_premium
  page: app.py
  title: English is the cheapest language on all 12 tokenisers; other languages need 1.02× to 17.09× as
    many tokens
  unit: tokens vs English (ratio)
  source_ids:
  - flores_plus
  - tokenizers_src
  controls:
  - key: tokenizer_filter
    type: selectbox
    label: Tokeniser
    default_value: o200k_base
    test_value: gpt2
    expected_text: 'Selected: 15 of 15 languages'
    filter:
      column: tokenizer_id
      operator: eq
  - key: language_filter
    type: multiselect
    label: Languages
    default_value:
    - Amharic
    - Arabic (Modern Standard)
    - Burmese
    - Chinese (Simplified)
    - English
    - French
    - German
    - Hindi
    - Japanese
    - Korean
    - Russian
    - Spanish
    - Swahili
    - Tamil
    - Thai
    test_value:
    - Burmese
    expected_text: 'Selected: Burmese'
    empty_test_value: []
    empty_expected_text: No observations match the selected filters.
    filter:
      column: language
      operator: isin
  outputs:
  - chart
  - metric
  - download
- id: buffer_by_language
  dataset_id: token_counts_long
  page: app.py
  title: On all 12 tokenisers, fitting 95% of sentences takes 24% to 43% more tokens than the average premium suggests
  unit: premium per sentence (tokens vs English) and buffer (%)
  source_ids:
  - flores_plus
  - tokenizers_src
  - anthropic_google_counts
  controls:
  - key: buffer_tokenizer
    type: selectbox
    label: Tokeniser
    default_value: o200k_base
    test_value: gpt2
    filter:
      column: tokenizer_id
      operator: eq
  - key: buffer_language_filter
    type: multiselect
    label: Languages
    default_value: &id001
    - Amharic
    - Arabic (Modern Standard)
    - Burmese
    - Chinese (Simplified)
    - French
    - German
    - Hindi
    - Japanese
    - Korean
    - Russian
    - Spanish
    - Swahili
    - Tamil
    - Thai
    test_value:
    - Hindi
    filter:
      column: language
      operator: isin
    expected_text: 'Selected: Hindi'
    empty_test_value: []
    empty_expected_text: No observations match the selected filters.
  - key: coverage_level
    type: radio
    label: Share of sentences the quota should fit
    default_value: 0.95
    test_value: 0.8
    filter:
      column: premium
      operator: quantile
  outputs:
  - chart
  - metric
  - download
- id: pricing_tiers
  dataset_id: token_premium
  page: app.py
  title: 'Three price tiers beat one price on all 12 tokenisers: the average overcharge is 13% to 240%, against 69% to 481% for one price'
  unit: premium (x English) and overcharge (%)
  source_ids:
  - flores_plus
  - tokenizers_src
  - team_assumption
  controls:
  - key: tier_tokenizer
    type: selectbox
    label: Tokeniser
    default_value: o200k_base
    test_value: gpt2
    filter:
      column: tokenizer_id
      operator: eq
  - key: tier_bounds
    type: slider
    label: Tier cut-offs (premium ×)
    default_value:
    - 1.5
    - 2.1
    test_value:
    - 2.0
    - 4.0
    filter:
      column: premium_vs_en
      operator: bins
  - key: tier_language_filter
    type: multiselect
    label: Languages served
    default_value: *id001
    test_value:
    - Hindi
    filter:
      column: language
      operator: isin
    expected_text: 'Selected: Hindi'
    empty_test_value: []
    empty_expected_text: No observations match the selected filters.
  outputs:
  - chart
  - metric
  - download
pipeline:
  acquisition_method: script
  acquisition_path: scripts/02_count_tokens.py
  transform_command:
  - bash
  - run_all.sh
  download_declared: true
  download_label: Download filtered data
  date_label: Latest observation
topic_integrity:
  indicator_codes: []
  original_source_organizations:
  - Open Language Data Initiative (FLORES+)
  - OpenAI
  - Alibaba
  - Google
  - Meta
  - Mistral AI
  - Anthropic
  latest_observation_year: 2026
  indicator_definition: Premium = total tokens for a language divided by total tokens for English on the
    same tokeniser and the same 200 FLORES+ sentences.
  aggregation_method: Sums of tokens over 200 sentences per language and tokeniser; Gini coefficient over
    the 15 language premiums of one tokeniser.
  classification_vintage: 'Not applicable: language and script codes follow FLORES+ (ISO 639-3 and ISO
    15924).'
